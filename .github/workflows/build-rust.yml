name: Build Rust binaries
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        working-directory: frontend
        run: bun install && bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  build:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            name: arm64-v8a
            toolchain: stable
          # MIPS builds are temporarily excluded until cross compilation succeeds.
          # - target: mipsel-unknown-linux-gnu
          #   name: mips32le-gnu
          #   toolchain: nightly
          #   rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set version
        run: |
          sed -i 's/^version = .*/version = "${{ inputs.version }}"/' backend/Cargo.toml
          sed -i 's/version = "v/version = "/' backend/Cargo.toml
          cat backend/Cargo.toml

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal -c rust-src

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Install cross
        run: type cross || cargo install cross --git https://github.com/cross-rs/cross

      # - name: Setup Cross.toml
      #   working-directory: backend
      #   run: |
      #     cat <<'EOF' > Cross.toml
      #     [target.mips-unknown-linux-musl]
      #     image = "ghcr.io/cross-rs/mips-unknown-linux-musl:edge"
      #     build-std = ["std", "panic_abort", "proc_macro"]
      #
      #     [target.mipsel-unknown-linux-musl]
      #     image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:edge"
      #     build-std = ["std", "panic_abort", "proc_macro"]
      #
      #     [target.mipsel-unknown-linux-gnu]
      #     build-std = ["std", "panic_abort", "proc_macro"]
      #     EOF
      #
      - name: Check metadata
        working-directory: backend
        run: cargo metadata --format-version 1

      - name: Inject frontend dist for cross
        working-directory: backend
        run: |
          cp -r ../frontend/dist ./dist
          sed -i 's|\.\./frontend/dist|./dist|' src/frontend_embedder.rs

      - name: Build binary
        working-directory: backend
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cross +${{ matrix.toolchain }} build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/xkeen-ui ../xkeen-ui-${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: xkeen-ui-${{ matrix.name }}
          path: xkeen-ui-${{ matrix.name }}

  nfqws2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: diagnostics/nfqws-probe/go.mod
      - name: Build ARM64 strategy probe
        working-directory: diagnostics/nfqws-probe
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags='-s -w' -o probe .
      - name: Bundle nfqws2 for XKeen
        run: sh router/build-nfqws2-bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: xkeen-nfqws2-arm64-v8a
          path: xkeen-nfqws2-arm64-v8a.tar.gz

  csqtt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch CSQTT 2.1.9 and apply router patch
        run: |
          git clone --depth 1 --branch v2.1.9 https://github.com/amurcanov/csqtt.git upstream-csqtt
          test "$(git -C upstream-csqtt rev-parse HEAD)" = 446293aa2e873ac5323ef6fd2316d9b81d966c11
          git -C upstream-csqtt apply ../router/patches/csqtt-2.1.9-router-call-closure.patch
      - name: Build ARM64 client
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo install cross --locked
          cd upstream-csqtt
          cross +1.97.1 build --release --target aarch64-unknown-linux-musl --manifest-path rust-client/Cargo.toml
      - name: Build ARM64 tun helper and package
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          mkdir csqtt-bundle
          cp upstream-csqtt/rust-client/target/aarch64-unknown-linux-musl/release/client csqtt-bundle/client
          aarch64-linux-gnu-gcc -static -O2 -o csqtt-bundle/csqtt-tun-fd router/csqtt-tun-fd.c
          cp router/S99csqtt router/csqtt-run-219.sh router/csqtt-js-calls.sh router/csqtt-api-calls.sh router/vk-manual-hashes.sh csqtt-bundle/
          printf '2.1.9\n' > csqtt-bundle/client-version
          chmod 755 csqtt-bundle/*
          tar -czf csqtt-client-arm64-v8a.tar.gz -C csqtt-bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: csqtt-client-arm64-v8a
          path: csqtt-client-arm64-v8a.tar.gz

  wdtt_plus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build WDTT Plus v18 client
        run: |
          git clone --depth 1 --branch v18 https://github.com/Ivan4537/WDTT-Plus.git upstream-wdtt
          test "$(git -C upstream-wdtt rev-parse HEAD)" = b3935b947acd81d95107869c8f33507f3f5c1309
          git -C upstream-wdtt apply ../router/wdtt-plus-client-v18.patch
          cd upstream-wdtt/go_client
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../../wdtt-client .
      - name: Package router client
        run: |
          mkdir wdtt-bundle
          cp wdtt-client wdtt-bundle/client
          cp router/S99wdtt-plus router/wdtt-plus-run.sh router/wdtt-plus-watchdog.sh router/wdtt-plus-calls.sh router/vk-manual-hashes.sh wdtt-bundle/
          chmod 755 wdtt-bundle/*
          tar -czf wdtt-plus-client-arm64-v8a.tar.gz -C wdtt-bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: wdtt-plus-client-arm64-v8a
          path: wdtt-plus-client-arm64-v8a.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [build, nfqws2, csqtt, wdtt_plus]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Write release checksums
        run: |
          for file in artifacts/xkeen-ui-*/* artifacts/xkeen-nfqws2-*/* artifacts/csqtt-client-*/* artifacts/wdtt-plus-client-*/*; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d ' ' -f 1)" "$(basename "$file")"
          done > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          prerelease: true
          files: |
            artifacts/xkeen-ui-*/*
            artifacts/xkeen-nfqws2-*/*
            artifacts/csqtt-client-*/*
            artifacts/wdtt-plus-client-*/*
            SHA256SUMS
