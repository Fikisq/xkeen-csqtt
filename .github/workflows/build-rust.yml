name: Build Rust binaries
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version: 1.2.3 or 1.2.3-beta.1 (without v)"
        required: true
        type: string
jobs:
  validate_version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]] || {
            echo 'Use x.x.x or x.x.x-beta.x without v'; exit 1;
          }
  frontend:
    needs: validate_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        working-directory: frontend
        run: bun install && bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  build:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            name: arm64-v8a
            toolchain: stable
          # MIPS builds are temporarily excluded until cross compilation succeeds.
          # - target: mipsel-unknown-linux-gnu
          #   name: mips32le-gnu
          #   toolchain: nightly
          #   rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set version
        run: |
          sed -i 's/^version = .*/version = "${{ inputs.version }}"/' backend/Cargo.toml
          sed -i 's/version = "v/version = "/' backend/Cargo.toml
          cat backend/Cargo.toml

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal -c rust-src

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Install cross
        run: type cross || cargo install cross --git https://github.com/cross-rs/cross

      # - name: Setup Cross.toml
      #   working-directory: backend
      #   run: |
      #     cat <<'EOF' > Cross.toml
      #     [target.mips-unknown-linux-musl]
      #     image = "ghcr.io/cross-rs/mips-unknown-linux-musl:edge"
      #     build-std = ["std", "panic_abort", "proc_macro"]
      #
      #     [target.mipsel-unknown-linux-musl]
      #     image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:edge"
      #     build-std = ["std", "panic_abort", "proc_macro"]
      #
      #     [target.mipsel-unknown-linux-gnu]
      #     build-std = ["std", "panic_abort", "proc_macro"]
      #     EOF
      #
      - name: Check metadata
        working-directory: backend
        run: cargo metadata --format-version 1

      - name: Check native Xray API compatibility
        working-directory: backend
        run: cargo test --example xray_api_checks

      - name: Inject frontend dist for cross
        working-directory: backend
        run: |
          cp -r ../frontend/dist ./dist
          sed -i 's|\.\./frontend/dist|./dist|' src/frontend_embedder.rs
          # cross mounts backend/ only; embedded strategy inputs live in router/.
          mkdir -p router-assets
          cp ../router/nfqws2-games.args ../router/nfqws2-flowseal.json router-assets/
          sed -i 's|../../router/nfqws2-|../router-assets/nfqws2-|g' src/nfqws2_search.rs

      - name: Build binary
        working-directory: backend
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cross +${{ matrix.toolchain }} build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/xkeen-ui ../xkeen-ui-${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: xkeen-ui-${{ matrix.name }}
          path: xkeen-ui-${{ matrix.name }}

  nfqws2:
    needs: validate_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: diagnostics/nfqws-probe/go.mod
      - name: Build ARM64 strategy probe
        working-directory: diagnostics/nfqws-probe
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags='-s -w' -o probe .
      - name: Bundle nfqws2 for XKeen
        run: sh router/build-nfqws2-bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: xkeen-nfqws2-arm64-v8a
          path: xkeen-nfqws2-arm64-v8a.tar.gz

  csqtt:
    needs: validate_version
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build native CSQTT 2.1.9 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake clang pkg-config
          rustup toolchain install stable --profile minimal --target aarch64-unknown-linux-musl
          sh router/build-csqtt-219.sh "$RUNNER_TEMP/csqtt-219"
      - uses: actions/upload-artifact@v7
        with:
          name: csqtt-client-arm64-v8a
          path: |
            csqtt-client-arm64-v8a.tar.gz
            csqtt-source-2.1.9-router.3.tar.gz

  wdtt_plus:
    needs: validate_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
      - name: Build WDTT Plus v20 router client
        run: |
          sh router/build-wdtt-plus-v20.sh "$RUNNER_TEMP/wdtt-v20"
          cp router/vk-manual-hashes.sh "$RUNNER_TEMP/wdtt-v20/package/"
          rm "$RUNNER_TEMP/wdtt-v20/package/SHA256SUMS"
          tar -czf wdtt-plus-client-arm64-v8a.tar.gz -C "$RUNNER_TEMP/wdtt-v20/package" .
      - uses: actions/upload-artifact@v7
        with:
          name: wdtt-plus-client-arm64-v8a
          path: wdtt-plus-client-arm64-v8a.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [build, nfqws2, csqtt, wdtt_plus]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Write release checksums
        run: |
          sh router/build-bootstrap.sh
          sha256sum xkeen-bootstrap-arm64-v8a.tar.gz setup.sh > SHA256SUMS
          for file in artifacts/xkeen-ui-*/* artifacts/xkeen-nfqws2-*/* artifacts/csqtt-client-*/* artifacts/wdtt-plus-client-*/*; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d ' ' -f 1)" "$(basename "$file")"
          done >> SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(inputs.version, '-beta.') }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/xkeen-ui-*/*
            artifacts/xkeen-nfqws2-*/*
            artifacts/csqtt-client-*/*
            artifacts/wdtt-plus-client-*/*
            xkeen-bootstrap-arm64-v8a.tar.gz
            setup.sh
            SHA256SUMS
