name: Build Rust binaries
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        working-directory: frontend
        run: bun install && bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  build:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            name: arm64-v8a
            toolchain: stable
          # MIPS builds are temporarily excluded until cross compilation succeeds.
          # - target: mipsel-unknown-linux-gnu
          #   name: mips32le-gnu
          #   toolchain: nightly
          #   rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set version
        run: |
          sed -i 's/^version = .*/version = "${{ inputs.version }}"/' backend/Cargo.toml
          sed -i 's/version = "v/version = "/' backend/Cargo.toml
          cat backend/Cargo.toml

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal -c rust-src

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Install cross
        run: type cross || cargo install cross --git https://github.com/cross-rs/cross

      # - name: Setup Cross.toml
      #   working-directory: backend
      #   run: |
      #     cat <<'EOF' > Cross.toml
      #     [target.mips-unknown-linux-musl]
      #     image = "ghcr.io/cross-rs/mips-unknown-linux-musl:edge"
      #     build-std = ["std", "panic_abort", "proc_macro"]
      #
      #     [target.mipsel-unknown-linux-musl]
      #     image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:edge"
      #     build-std = ["std", "panic_abort", "proc_macro"]
      #
      #     [target.mipsel-unknown-linux-gnu]
      #     build-std = ["std", "panic_abort", "proc_macro"]
      #     EOF
      #
      - name: Check metadata
        working-directory: backend
        run: cargo metadata --format-version 1

      - name: Check native Xray API compatibility
        working-directory: backend
        run: cargo test --example xray_api_checks

      - name: Inject frontend dist for cross
        working-directory: backend
        run: |
          cp -r ../frontend/dist ./dist
          sed -i 's|\.\./frontend/dist|./dist|' src/frontend_embedder.rs

      - name: Build binary
        working-directory: backend
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cross +${{ matrix.toolchain }} build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/xkeen-ui ../xkeen-ui-${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: xkeen-ui-${{ matrix.name }}
          path: xkeen-ui-${{ matrix.name }}

  nfqws2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: diagnostics/nfqws-probe/go.mod
      - name: Build ARM64 strategy probe
        working-directory: diagnostics/nfqws-probe
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags='-s -w' -o probe .
      - name: Bundle nfqws2 for XKeen
        run: sh router/build-nfqws2-bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: xkeen-nfqws2-arm64-v8a
          path: xkeen-nfqws2-arm64-v8a.tar.gz

  csqtt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch pinned CSQTT 2.5.0 APK router runtime
        run: |
          # The APK client and Bionic runtime were adapted separately from this repository.
          curl -fLsS https://github.com/Fikisq/xkeen-csqtt/releases/download/v0.1.0-beta.3/csqtt-client-arm64-v8a.tar.gz -o csqtt-bootstrap.tar.gz
          echo '94a785e84f8cd7239a2e59798ab2811068901869f19ee0339895facfeefe32ec  csqtt-bootstrap.tar.gz' | sha256sum -c -
          mkdir csqtt-bundle
          tar -xzf csqtt-bootstrap.tar.gz -C csqtt-bundle
          cp router/S99csqtt router/csqtt-run-219.sh router/csqtt-run-250.sh router/csqtt-js-calls.sh router/csqtt-api-calls.sh router/vk-manual-hashes.sh csqtt-bundle/
      - name: Build current ARM64 event adapter
        run: |
          rustup toolchain install stable --profile minimal
          cargo install cross --locked
          cross build --release --locked --target aarch64-unknown-linux-musl --manifest-path router/csqtt-native-events/Cargo.toml
          cp router/csqtt-native-events/target/aarch64-unknown-linux-musl/release/csqtt-native-events csqtt-bundle/
          chmod 755 csqtt-bundle/client csqtt-bundle/csqtt-* csqtt-bundle/S99csqtt csqtt-bundle/vk-manual-hashes.sh csqtt-bundle/runtime/linker
          tar -czf csqtt-client-arm64-v8a.tar.gz -C csqtt-bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: csqtt-client-arm64-v8a
          path: csqtt-client-arm64-v8a.tar.gz

  wdtt_plus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
      - name: Build WDTT Plus v20 router client
        run: |
          sh router/build-wdtt-plus-v20.sh "$RUNNER_TEMP/wdtt-v20"
          cp router/vk-manual-hashes.sh "$RUNNER_TEMP/wdtt-v20/package/"
          rm "$RUNNER_TEMP/wdtt-v20/package/SHA256SUMS"
          tar -czf wdtt-plus-client-arm64-v8a.tar.gz -C "$RUNNER_TEMP/wdtt-v20/package" .
      - uses: actions/upload-artifact@v7
        with:
          name: wdtt-plus-client-arm64-v8a
          path: wdtt-plus-client-arm64-v8a.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [build, nfqws2, csqtt, wdtt_plus]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Write release checksums
        run: |
          for file in artifacts/xkeen-ui-*/* artifacts/xkeen-nfqws2-*/* artifacts/csqtt-client-*/* artifacts/wdtt-plus-client-*/*; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d ' ' -f 1)" "$(basename "$file")"
          done > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          prerelease: true
          files: |
            artifacts/xkeen-ui-*/*
            artifacts/xkeen-nfqws2-*/*
            artifacts/csqtt-client-*/*
            artifacts/wdtt-plus-client-*/*
            SHA256SUMS
